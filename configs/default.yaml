# 기본 설정. 모델명/청크 크기/top_k 등은 코드에 하드코딩하지 않고 여기서만 정한다.
# 실험할 때는 이 파일을 configs/exp_NNN_*.yaml 로 복사해서 바꾼다.

paths:
  raw_dir: data/raw
  metadata_file: data/raw/data_list.csv  # 확인됨 (2026-11-11): 100행, UTF-8 BOM. '텍스트' 컬럼은 대부분 목차라 사용하지 않음 (본문은 원본 파일을 직접 파싱)
  processed_dir: data/processed
  vectorstore_dir: data/vectorstore

ingest:
  timeout_sec: 60  # 파일 1개 파싱 제한 시간(초). 넘으면 실패로 기록하고 건너뜀
  timeout_sec_by_ext:  # 확장자별 예외 (표 탐지가 느린 큰 PDF 는 297쪽에 약 60초 걸림)
    pdf: 300
  workers: 4  # 동시에 파싱할 파일 수 (파일마다 별도 프로세스)

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  add_header: true  # 청크 앞에 "[사업명 | 발주기관]" 한 줄을 붙인다

embedding:
  provider: huggingface
  model: BAAI/bge-m3
  device: cpu

vectorstore:
  collection_name: rfp

retrieval:
  top_k: 5

llm:
  provider: google_genai
  model: gemini-flash-latest  # artificialanalysis 기준으로 Phase 1 시작 시 확정
  temperature: 0

judge:
  provider: openrouter  # 답변 모델과 다른 계열 (Phase 2에서 확정)
  model: TBD  # 답변 모델과 다른 계열
  temperature: 0
