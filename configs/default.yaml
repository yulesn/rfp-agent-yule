# 기본 설정. 모델명/청크 크기/top_k 등은 코드에 하드코딩하지 않고 여기서만 정한다.
# 실험할 때는 이 파일을 configs/exp_NNN_*.yaml 로 복사해서 바꾼다.

paths:
  raw_dir: data/raw
  metadata_file: data/raw/data_list.csv  # TODO: 실제 파일명 확인 후 수정
  processed_dir: data/processed
  vectorstore_dir: data/vectorstore

chunking:
  chunk_size: 1000
  chunk_overlap: 200

embedding:
  provider: huggingface
  model: BAAI/bge-m3
  device: cpu

vectorstore:
  collection_name: rfp

retrieval:
  top_k: 5

llm:
  provider: google_genai
  model: gemini-flash-latest  # artificialanalysis 기준으로 Phase 1 시작 시 확정
  temperature: 0

judge:
  provider: openrouter  # 답변 모델과 다른 계열 (Phase 2에서 확정)
  model: TBD  # 답변 모델과 다른 계열
  temperature: 0
